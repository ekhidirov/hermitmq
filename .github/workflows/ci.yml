name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21' 

    - name: Verify dependencies
      run: go mod tidy

    - name: Build Broker and Tools
      run: |
        mkdir -p bin
        go build -v -o bin/hermitmq ./cmd/hermitmq/main.go
        go build -v -o bin/consumer ./cmd/consumer/main.go
        go build -v -o bin/producer ./cmd/producer/main.go

    - name: Run Tests with Race Detector
      run: go test -v -race ./...